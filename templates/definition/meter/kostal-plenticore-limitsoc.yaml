template: kostal-plenticore-limitsoc
products:
  - brand: Kostal
    description:
      de: Plenticore Hybrid (limitSoc-Fallback)
      en: Plenticore Hybrid (limitSoc fallback)
capabilities: ["battery-control"]
caveats:
  - description:
      de: |
        **_Nur als Rückfalloption gedacht!_** Bevorzugt die Standard-Vorlage (Plenticore Hybrid) verwenden. Diese Vorlage steuert die Batterie ausschließlich über limitSoc und ist gedacht für ältere Wechselrichter, bei denen die batteryMode-Steuerung die Modbus-Register nicht zuverlässig zurücksetzt. Bei Problemen Installateur und Kostal kontaktieren.
      en: |
        **_Intended as a fallback option only!_** Prefer the default template (Plenticore Hybrid). This template controls the battery exclusively via limitSoc and is intended for older inverters where the batteryMode control does not reliably reset the Modbus registers. Contact your installer and Kostal in case of problems.
    link: https://github.com/evcc-io/evcc/wiki/Kostal-Plenticore_
requirements:
  description:
    de: |
      Nur ein System kann und darf auf den Wechselrichter zugreifen! Für die aktive Batteriesteuerung muss die Funktion externe Batteriesteuerung über Modbus mit dem Handwerkerzugang aktiviert sein.
    en: |
      Only a single system may access the inverter! For active battery control the function external battery control via Modbus must be activated using installer access.
params:
  - name: usage
    choice: ["battery"]
  - name: modbus
    choice: ["tcpip"]
    id: 71
    port: 1502
  - name: endianness
    description:
      de: Byte-Reihenfolge (Little/Big)
      en: Endianness (Little/Big)
    type: choice
    choice: ["little", "big"]
    default: little
    advanced: true
  - preset: battery-params
  - name: capacity
    service: modbus/read?address=1068&type=holding&encoding=float32s&scale=0.001&{modbus}
  - name: minsoc
    service: modbus/read?address=1042&type=holding&encoding=float32s&{modbus}
  - name: maxsoc
    service: modbus/read?address=1044&type=holding&encoding=float32s&{modbus}
  - name: maxchargepower
    service: modbus/read?address=1038&type=holding&encoding=float32s&resulttype=int&{modbus}
  - name: maxdischargepower
    service: modbus/read?address=1040&type=holding&encoding=float32s&resulttype=int&{modbus}
  - name: watchdog
    type: duration
    default: 60s
    advanced: true
render: |
  type: custom
  power:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 802:W # 802 battery control
  soc:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 802:SoC # 802 battery control
  limitsoc:
    source: watchdog
    timeout: {{ .watchdog }} # re-write at timeout/2
    set:
      source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 1042 # limit soc
        type: writemultiple
        encoding: {{ if (eq .endianness "big") }}float32{{ else }}float32s{{ end }}
  {{- include "battery-params" . }}
